name: Reusable

on:
  workflow_call:
    inputs:
      node-version:
        required: true
        type: string
      run-build:
        required: false
        type: boolean
        default: true
    outputs:
      test-status:
        value: ${{ jobs.pipeline.outputs.test-status }}

jobs:
  pipeline:
    runs-on: ubuntu-latest

    outputs:
      test-status: ${{ steps.test.outputs.status }}

    steps:
      # Descargar repo
      - name: Checkout
        uses: actions/checkout@v4

      # Node version (IMPORTANTE: fijo, no floating)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      # CACHE (optimizado y sin colisiones)
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ inputs.node-version }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ inputs.node-version }}-

      # Instalar dependencias
      - name: Install dependencies
        run: npm install

      # Tests
      - name: Run tests
        id: test
        run: |
          npm test
          echo "status=success" >> $GITHUB_OUTPUT

      # Build
      - name: Build project
        if: inputs.run-build == true
        run: npm run build

      # ARTIFACT BUILD
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: dist/
          retention-days: 7

      # ARTIFACT TEST LOGS
      - name: Upload test logs
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ github.sha }}
          path: |
            npm-debug.log
          retention-days: 5
